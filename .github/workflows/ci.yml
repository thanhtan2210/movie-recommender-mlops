name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # A small synthetic model: the image is built and tested without any secret.
      - run: python -m scripts.make_dummy_model
      - run: docker build -t movie-rec .
      - name: Start the container and call the API
        run: |
          docker run -d --name api -p 8000:8000 movie-rec
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8000/recommend/1?n=5')" = "200"
          curl -fsS http://localhost:8000/health
          curl -fsS 'http://localhost:8000/recommend/1?n=5'
      - name: Container logs
        if: always()
        run: docker logs api || true
